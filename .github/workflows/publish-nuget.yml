name: .NET build, test, and publish

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      GLACIER_EMBED_NO_DOWNLOAD: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure runner swap
        run: |
          sudo fallocate -l 8G /mnt/swapfile_extra || sudo dd if=/dev/zero of=/mnt/swapfile_extra bs=1M count=8192
          sudo chmod 600 /mnt/swapfile_extra
          sudo mkswap /mnt/swapfile_extra
          sudo swapon /mnt/swapfile_extra

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup NuGet sources
        run: |
          mkdir -p ../nuget-local
          dotnet nuget add source --name "github-packages" --username "${{ github.repository_owner }}" --password "${{ secrets.GITHUB_TOKEN }}" --store-password-in-clear-text "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" || true

      - name: Restore dependencies (wait for upstream NuGet indexing)
        run: |
          elapsed=0
          until dotnet restore --no-cache > /dev/null 2>&1; do
            if [ $elapsed -ge 1200 ]; then
              dotnet restore --no-cache
              exit 1
            fi
            echo "Waiting for upstream NuGet packages to index (${elapsed}s elapsed)..."
            sleep 30
            elapsed=$((elapsed+30))
          done

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/Glacier.Inference.Tests/Glacier.Inference.Tests.csproj -c Release --no-build --blame-hang --blame-hang-dump-type none --blame-hang-timeout 60s --logger "console;verbosity=normal"

      - name: Pack Library
        run: dotnet pack src/Glacier.Inference/Glacier.Inference.csproj --configuration Release --output packages

      - name: Pack CLI Tool
        run: dotnet pack src/Glacier.Inference.Cli/Glacier.Inference.Cli.csproj --configuration Release --output packages

      - name: Publish to GitHub Packages
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        run: dotnet nuget push "packages/*.nupkg" --api-key ${{ secrets.GITHUB_TOKEN }} --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json --skip-duplicate

      - name: NuGet login (Trusted Publishing OIDC)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        uses: NuGet/login@v1
        id: login
        with:
          user: spuriousbugfix

      - name: Publish to nuget.org
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        env:
          NUGET_OIDC_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "packages/*.nupkg" --api-key "$NUGET_OIDC_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate


      - name: Publish Standalone CLI Binaries
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p release-assets
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          dotnet publish src/Glacier.Inference.Cli/Glacier.Inference.Cli.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/win-x64
          zip -j "release-assets/glacier-${TAG_NAME}-win-x64.zip" publish/win-x64/glacier.exe
          dotnet publish src/Glacier.Inference.Cli/Glacier.Inference.Cli.csproj -c Release -r win-arm64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/win-arm64
          zip -j "release-assets/glacier-${TAG_NAME}-win-arm64.zip" publish/win-arm64/glacier.exe
          dotnet publish src/Glacier.Inference.Cli/Glacier.Inference.Cli.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/linux-x64
          tar -czf "release-assets/glacier-${TAG_NAME}-linux-x64.tar.gz" -C publish/linux-x64 glacier
          dotnet publish src/Glacier.Inference.Cli/Glacier.Inference.Cli.csproj -c Release -r osx-arm64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/osx-arm64
          tar -czf "release-assets/glacier-${TAG_NAME}-osx-arm64.tar.gz" -C publish/osx-arm64 glacier

      - name: Create GitHub Release (Inference with CLI binaries)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packages/*.nupkg
            release-assets/*
          generate_release_notes: true
